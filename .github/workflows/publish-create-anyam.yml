name: Publish create-anyam

on:
  workflow_dispatch:
  push:
    tags:
      - "create-anyam-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-create-anyam-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish create-anyam
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Check out the exact release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@v1
        with:
          version: "11.20.0"
          install: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Use the npm trusted-publishing client
        run: npm install --global npm@11.15.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run repository checks
        run: npm run check

      - name: Qualify package entrypoints
        run: npm run verify:package

      - name: Build the publishable workspace
        run: npm run build --workspace=create-anyam

      - name: Publish through npm trusted publishing
        run: npm publish --workspace=create-anyam --access public
