name: Publish create-anyam

on:
  workflow_dispatch:
  push:
    tags:
      - "create-anyam-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-create-anyam-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish create-anyam
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: npm-publish
    steps:
      - name: Check out the exact release
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: "11.20.0"
          install: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"

      - name: Use the npm trusted-publishing client
        run: npm install --global npm@11.15.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run repository checks
        run: npm run check

      - name: Qualify package entrypoints
        run: npm run verify:package

      - name: Build the publishable workspace
        run: npm run build --workspace=create-anyam

      - name: Publish through npm trusted publishing
        run: npm publish --workspace=create-anyam --access public
