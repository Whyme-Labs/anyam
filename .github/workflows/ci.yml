name: Repository gate

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Runner provider for this manual gate"
        required: false
        type: choice
        options:
          - github-hosted
          - blacksmith
        default: blacksmith
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ANYAM_REPOSITORY_GATE_PROVIDER: ${{ inputs.provider || vars.ANYAM_REPOSITORY_GATE_PROVIDER || 'blacksmith' }}

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Anyam repository gate
    runs-on: ${{ (inputs.provider == 'github-hosted' || (inputs.provider == '' && vars.ANYAM_REPOSITORY_GATE_PROVIDER == 'github-hosted')) && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up pnpm and Bun for package entrypoint qualification
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"

      - name: Qualify the Linux host sandbox
        if: runner.os == 'Linux'
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
          bwrap --version
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --unshare-net --cap-drop ALL --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /sbin /sbin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc --proc /proc --dev /dev --bind "$probe" "$probe" --chdir "$probe" /usr/bin/true

      - name: Probe the Linux Workspace command runtime
        if: runner.os == 'Linux'
        run: |
          node_path="$(command -v node)"
          node_root="$(dirname "$(dirname "$node_path")")"
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --unshare-net --cap-drop ALL --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /sbin /sbin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --ro-bind /etc /etc --ro-bind "$node_root" "$node_root" --proc /proc --dev /dev --bind "$probe" "$probe" --chdir "$probe" /bin/sh -c "node -e \"require('node:fs').mkdirSync('dist',{recursive:true});require('node:fs').writeFileSync('dist/worker.bundle','private-alpha')\""
          test "$(cat "$probe/dist/worker.bundle")" = private-alpha

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Qualify Anyam's Linux Workspace boundary
        if: runner.os == 'Linux'
        run: npm run qualification:linux-workspace

      - name: Record runner receipt
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const receipt = {
            protocol: "anyam.repository-gate-runner/v1",
            provider: process.env.ANYAM_REPOSITORY_GATE_PROVIDER,
            runnerName: process.env.RUNNER_NAME,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            runId: process.env.GITHUB_RUN_ID,
            sha: process.env.GITHUB_SHA,
            credentialMaterialStored: false,
            providerFactsAreNotAnyamLimits: true,
          };
          console.log(JSON.stringify(receipt));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`json\n${JSON.stringify(receipt, null, 2)}\n\`\`\`\n`);
          NODE

      - name: Run the repository gate
        run: npm run check
